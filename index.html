<title>Tala Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: library grid of covers; editor = tab bar + ribbon (Draw / Insert / Tools / View) + one or two panes with split view. Floating calculator and focus timer widgets. */
:root {
  --desk: #e4e7ee;
  --surface: #ffffff;
  --surface-2: #f1f3f7;
  --ink: #1c2230;
  --muted: #66708a;
  --line: #dbe0e8;
  --accent: #2f6fed;
  --accent-soft: rgba(47, 111, 237, .13);
  --accent-ink: #ffffff;
  --danger: #d64045;
  --ok: #2f9e66;
  --shadow: 0 10px 30px rgba(20, 28, 45, .16);
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --lcd: "Share Tech Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121419; --surface: #1d2027; --surface-2: #272b34; --ink: #e9ecf2; --muted: #9aa3b6;
    --line: #343946; --accent: #7aa2ff; --accent-soft: rgba(122, 162, 255, .18); --accent-ink: #0d1220;
    --danger: #ff6b6f; --ok: #5fd39a; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121419; --surface: #1d2027; --surface-2: #272b34; --ink: #e9ecf2; --muted: #9aa3b6;
  --line: #343946; --accent: #7aa2ff; --accent-soft: rgba(122, 162, 255, .18); --accent-ink: #0d1220;
  --danger: #ff6b6f; --ok: #5fd39a; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
:root[data-app-theme="light"] {
  --desk: #e4e7ee; --surface: #ffffff; --surface-2: #f1f3f7; --ink: #1c2230; --muted: #66708a;
  --line: #dbe0e8; --accent: #2f6fed; --accent-soft: rgba(47, 111, 237, .13); --accent-ink: #ffffff;
  --danger: #d64045; --ok: #2f9e66; --shadow: 0 10px 30px rgba(20, 28, 45, .16); color-scheme: light;
}
:root[data-app-theme="dark"] {
  --desk: #121419; --surface: #1d2027; --surface-2: #272b34; --ink: #e9ecf2; --muted: #9aa3b6;
  --line: #343946; --accent: #7aa2ff; --accent-soft: rgba(122, 162, 255, .18); --accent-ink: #0d1220;
  --danger: #ff6b6f; --ok: #5fd39a; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 15px/1.4 var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; }
button:focus { outline: none; }
button:focus-visible, input:focus-visible, .tab:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
input[type="range"] { accent-color: var(--accent); }

/* ---------- shared controls ---------- */
.tb {
  width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; display: grid; place-items: center;
  cursor: pointer; color: var(--ink); flex: none; position: relative; transition: transform .08s, background-color .12s;
}
.tb svg { width: 22px; height: 22px; }
.tb:active:not(:disabled) { transform: scale(.9); background: var(--surface-2); }
.tb[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tb:disabled { opacity: .3; cursor: default; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; transition: transform .08s;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.otb { width: 40px; height: 40px; border-radius: 11px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink); transition: transform .08s, background-color .12s; }
.otb svg { width: 21px; height: 21px; }
.otb:active { transform: scale(.9); }
.otb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.otb .aa { font-size: 1.05rem; font-weight: 700; line-height: 1; }
.sw {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); background: var(--c); flex: none; padding: 0;
  box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--ink) 28%, transparent); cursor: pointer; transition: transform .08s;
}
.sw:active { transform: scale(.88); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--accent); }
@media (hover: hover) {
  .tb:hover:not([aria-pressed="true"]):not(:disabled), .otb:hover:not([aria-pressed="true"]), .rb:hover:not([aria-pressed="true"]) { background: var(--surface-2); }
  .btn:hover { filter: brightness(1.04); }
  .mi:hover:not(:disabled) { background: var(--surface-2); }
  .tab:hover { background: var(--surface-2); }
  .nb-more:hover { background: var(--surface); }
  .sw:hover { transform: scale(1.08); }
}

/* ---------- library ---------- */
#library { position: fixed; inset: 0; overflow-y: auto; padding-inline: 16px; padding-block: calc(env(safe-area-inset-top, 0px) + 22px) 48px; }
.lib-wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }
.lib-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: grid; gap: 2px; }
.brand h1 { margin: 0; font: 700 3rem/1 var(--hand); }
.brand p { margin: 0; color: var(--muted); }
.lib-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 20px; }
.nb { display: grid; gap: 8px; min-width: 0; }
.nb-open { all: unset; cursor: pointer; display: block; border-radius: 6px 14px 14px 6px; }
.nb-open:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 3px; }
.cover { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 6px 14px 14px 6px; position: relative; overflow: hidden; box-shadow: var(--shadow); background: var(--c); transition: transform .12s; }
.nb-open:active .cover { transform: scale(.97); }
.cover::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 14px; background: rgba(0, 0, 0, .18); }
.cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.18), transparent 45%); }
.cover .label { position: absolute; left: 26px; right: 14px; top: 22%; background: #fffdf7; color: #1c2230; border-radius: 6px; padding: 8px 10px; font: 700 1.35rem/1.05 var(--hand); text-wrap: balance; box-shadow: 0 2px 0 rgba(0,0,0,.12); overflow-wrap: anywhere; }
.nb-meta { display: flex; justify-content: space-between; gap: 6px; align-items: center; min-width: 0; }
.nb-meta span { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nb-more { width: 36px; height: 36px; border-radius: 10px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
.nb-more svg { width: 20px; height: 20px; }
.empty-shelf { color: var(--muted); padding: 30px 0; }
.lib-status { color: var(--muted); font-size: .85rem; }

/* ---------- editor ---------- */
#editor { position: fixed; inset: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 2px; padding: 5px 8px; padding-top: calc(5px + env(safe-area-inset-top, 0px)); background: var(--surface); min-width: 0; }
.tabs { display: flex; gap: 4px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; align-items: center; padding: 0 4px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 4px 0 12px; border-radius: 11px; flex: none; border: 1px solid transparent; background: none; cursor: pointer; max-width: 240px; min-width: 0; color: var(--muted); }
.tab .cv { width: 10px; height: 15px; border-radius: 2px 4px 4px 2px; background: var(--c); flex: none; }
.tab b { font: 700 1.3rem/1 var(--hand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.tab .where { white-space: nowrap; font-size: .66rem; font-weight: 800; letter-spacing: .06em; color: var(--accent); }
.tab .x { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
.tab .x svg { width: 16px; height: 16px; }
.tab[aria-selected="true"] { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.vsep { width: 1px; height: 26px; background: var(--line); margin: 0 4px; flex: none; }
.status { font-size: .75rem; color: var(--muted); white-space: nowrap; padding: 0 6px; }
.status.err { color: var(--danger); }
.pomo-chip { height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: .82rem; font-variant-numeric: tabular-nums; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; flex: none; }
.pomo-chip svg { width: 16px; height: 16px; }
.pomo-chip.brk { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }

/* ribbon */
.rsize { position: absolute; right: 2px; bottom: 2px; width: 22px; height: 22px; padding: 2px; border: 0; background: none; color: var(--muted); cursor: nwse-resize; z-index: 3; touch-action: none; opacity: .7; border-radius: 6px; }
.rsize:hover { opacity: 1; background: var(--surface-2); }
.rsize svg { width: 100%; height: 100%; display: block; }
.ribbon.compact .rsize { width: 18px; height: 18px; }
#rsizeTip { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: var(--surface); font-weight: 800; padding: 6px 14px; border-radius: 99px; z-index: 90; pointer-events: none; }
#rsizeTip[hidden] { display: none; }
body.rsizing, body.rsizing * { cursor: nwse-resize !important; }
.ribbon:not(.floating) { position: relative; }
.ribbon { background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; box-shadow: 0 2px 6px rgba(15, 20, 35, .05); }
.rtabs { display: flex; align-items: flex-end; gap: 2px; padding: 0 10px; height: 34px; border-bottom: 1px solid var(--line); }
.rtab { height: 34px; padding: 0 14px; border: 0; background: none; font-weight: 800; font-size: .8rem; letter-spacing: .03em; color: var(--muted); position: relative; cursor: pointer; }
.rtab[aria-selected="true"] { color: var(--accent); }
.rtab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.rspacer { flex: 1; }
.rcollapse { width: 34px; height: 30px; border: 0; background: none; border-radius: 8px; color: var(--muted); cursor: pointer; display: grid; place-items: center; align-self: center; }
.rcollapse svg { width: 18px; height: 18px; transition: transform .2s; }
.ribbon.collapsed .rcollapse svg { transform: rotate(180deg); }
.ribbon.collapsed .rbody { display: none; }
.rctx { display: flex; align-items: stretch; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 18px; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border: 1.5px solid color-mix(in srgb, var(--accent) 28%, transparent); flex: none; }
.rctx-h { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 6px; min-width: 54px; max-width: 72px; color: var(--accent); text-align: center; }
.rctx-h svg { width: 20px; height: 20px; } .rctx-h b { font-size: .64rem; line-height: 1.15; font-weight: 800; }
.rctx .rgroup { background: var(--surface); }
.ribbon.compact .rctx-h b { display: none; } .ribbon.compact .rctx-h { min-width: 30px; }
.stk-row { display: flex; gap: 2px; flex-wrap: nowrap; max-width: min(560px, 60vw); overflow-x: auto; scrollbar-width: thin; }
.stk-btn.emo span { font-size: 28px; line-height: 38px; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
.stk-btn img { width: 38px; height: 38px; object-fit: contain; }
.stk-btn.add { border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--accent); } .stk-btn.add svg { width: 22px; height: 22px; }
.stk-btn.del { outline: 2px dashed var(--danger); outline-offset: -2px; }
.stk-tabs { min-width: 210px; }
.stk-prev { display: grid; place-items: center; background: repeating-conic-gradient(#e9ecef 0 25%, #fff 0 50%) 0 0 / 18px 18px; border-radius: 12px; padding: 12px; } .stk-prev img { max-width: 100%; max-height: 260px; }
#greetTip[role="button"] { cursor: pointer; border-radius: 8px; }
#greetTip.tip-pop { animation: tipPop .35s ease-out; }
@keyframes tipPop { 0% { opacity: 0; transform: translateY(6px) scale(.98); } 100% { opacity: 1; transform: none; } }
.owl-hop { animation: owlHop .45s ease-out; }
@keyframes owlHop { 30% { transform: translateY(-10px) rotate(-6deg); } 60% { transform: translateY(0) rotate(4deg); } }
.rbody { display: flex; align-items: stretch; padding: 6px 6px 3px; overflow-x: auto; scrollbar-width: thin; }
.rgroup { display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 0 10px; border-right: 1px solid var(--line); flex: none; }
.rgroup:last-child { border-right: 0; }
.rg-items { display: flex; align-items: center; gap: 4px; min-height: 58px; }
.rg-label { font-size: .64rem; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding-top: 1px; }
.rb {
  display: grid; justify-items: center; align-content: center; gap: 3px; min-width: 56px; height: 56px; padding: 0 6px; border-radius: 12px;
  border: 0; background: none; cursor: pointer; color: var(--ink); font-size: .68rem; font-weight: 700; position: relative; transition: transform .08s, background-color .12s;
}
.rb svg { width: 24px; height: 24px; }
.rb:active { transform: scale(.93); }
.rb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.rb .dot { position: absolute; top: 7px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--dot, transparent); box-shadow: 0 0 0 1.5px var(--surface); }
.rhint { color: var(--muted); font-size: .85rem; max-width: 280px; line-height: 1.35; }
.slider { display: grid; gap: 4px; width: 170px; padding: 0 4px; }
.slider .sl-top { display: flex; justify-content: space-between; font-size: .75rem; font-weight: 700; color: var(--muted); }
.slider .sl-top b { color: var(--ink); font-variant-numeric: tabular-nums; }
.slider input { width: 100%; height: 26px; margin: 0; }
.fillbtn { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; background: var(--surface); padding: 0; }
.fillbtn i { width: 24px; height: 24px; border-radius: 6px; background: var(--c); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ink) 25%, transparent); }
.fillbtn i.none { background: linear-gradient(135deg, transparent 45%, var(--danger) 45% 55%, transparent 55%); }
.stk-btn { width: 44px; height: 44px; border-radius: 10px; border: 0; background: none; cursor: pointer; padding: 3px; flex: none; }
.stk-btn[aria-pressed="true"] { background: var(--accent-soft); }
.stk-btn canvas { width: 38px; height: 38px; }

/* panes */
.body { position: relative; display: flex; min-height: 0; min-width: 0; background: var(--desk); flex: 1 1 auto; }
.body.col { flex-direction: column; }
.pane { position: relative; flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; }
[hidden] { display: none !important; }
.pane[hidden] { display: none !important; }
.body.grid { display: grid; gap: 6px; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.body.g3 { grid-template-areas: "a b" "a c"; }
.body.g3.col { grid-template-areas: "a a" "b c"; }
.body.g3 #paneA { grid-area: a; } .body.g3 #paneB { grid-area: b; } .body.g3 #paneC { grid-area: c; }
.body.grid .pane.active::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2.5px var(--accent); pointer-events: none; z-index: 4; }
.pane.locked::before { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--desk) 30%, transparent); z-index: 8; pointer-events: none; }
.lock-chip { display: none; position: absolute; top: 10px; right: 10px; z-index: 9; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700; font-size: .8rem; box-shadow: var(--shadow); cursor: pointer; }
.lock-chip svg { width: 16px; height: 16px; }
.pane.locked .lock-chip { display: inline-flex; }
.body.split .pane.active::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2.5px var(--accent); pointer-events: none; z-index: 4; }
.stage { position: absolute; inset: 0; background: var(--desk); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.stage > canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
.divider { flex: none; width: 16px; cursor: col-resize; background: var(--surface); display: grid; place-items: center; touch-action: none; border-inline: 1px solid var(--line); z-index: 6; }
.body.col .divider { width: auto; height: 16px; cursor: row-resize; border-inline: 0; border-block: 1px solid var(--line); }
.divider i { width: 4px; height: 44px; border-radius: 2px; background: var(--muted); opacity: .55; }
.body.col .divider i { width: 44px; height: 4px; }
.pane-info {
  position: absolute; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; height: 36px; padding: 0 14px;
  border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); font-size: .8rem;
  font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pane-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; z-index: 3; }

/* ruler */
.ruler {
  position: absolute; left: 0; top: 0; z-index: 6; touch-action: none; border-radius: 10px; transform-origin: 50% 50%;
  background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 8px 24px rgba(10, 15, 30, .22), inset 0 0 0 1px color-mix(in srgb, var(--ink) 18%, transparent); cursor: grab;
}
.ruler canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.ruler .r-ang { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: 800; font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--surface); padding: 2px 8px; border-radius: 8px; pointer-events: none; }
.ruler .r-knob { position: absolute; right: -14px; top: 50%; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%; background: var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: alias; }
.ruler .r-knob::after { content: ""; position: absolute; inset: 8px; border: 2px solid var(--accent-ink); border-radius: 50%; border-left-color: transparent; }

.strip { position: absolute; left: 0; top: 0; bottom: 0; width: 170px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; display: grid; align-content: start; gap: 12px; z-index: 9; transform: translateX(-102%); transition: transform .2s ease; touch-action: pan-y; }
.strip.open { transform: none; }
.strip-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: .85rem; }
.thumb { display: grid; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; justify-items: center; }
.thumb canvas { width: 132px; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px var(--line), 0 3px 8px rgba(0,0,0,.08); }
.thumb.current canvas { box-shadow: 0 0 0 2.5px var(--accent); }
.thumb span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.selmenu { position: absolute; display: flex; gap: 2px; align-items: center; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 4px; z-index: 7; border: 1px solid var(--line); }
.selmenu .sw { width: 24px; height: 24px; }
.selmenu .selpick { gap: 4px; display: inline-flex; align-items: center; }
.selmenu .selpick[aria-pressed="true"] { background: var(--accent, #2f6fed); color: #fff; }
.selmenu .selcount { min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: rgba(47,111,237,.15); color: inherit; font-size: .68rem; display: inline-grid; place-items: center; }
.selmenu .selpick[aria-pressed="true"] .selcount { background: rgba(255,255,255,.25); }
.opt-sep { width: 1px; height: 26px; background: var(--line); margin: 0 4px; flex: none; }

.onb-pick button { display: grid; gap: 6px; justify-items: center; padding: 16px 10px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.onb-pick button svg { width: 32px; height: 32px; color: var(--accent); }

.onb-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.onb-h3 { margin: 4px 0 0; font-size: .95rem; color: var(--muted); }
.onb-card .seg { width: 100%; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -12px; left: var(--x); width: 8px; height: 14px; background: var(--c); border-radius: 2px; animation: conf 2.4s var(--d) ease-in forwards; opacity: 0; }
@keyframes conf { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 0; transform: translateY(560px) rotate(540deg); } }
.modal-back { position: fixed; inset: 0; background: rgba(10, 14, 22, .45); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto; padding: 22px; display: grid; gap: 16px; }
.modal h2 { margin: 0; font-size: 1.25rem; }
.modal p { margin: 0; color: var(--muted); }
.field { display: grid; gap: 8px; }
.field > span { font-size: .78rem; font-weight: 800; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.field input[type="text"] { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 0 14px; font: 600 1.05rem var(--ui); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; font-size: .85rem; display: inline-flex; align-items: center; gap: 8px; }
.chip i { display: inline-block; border: 1.5px solid currentColor; border-radius: 2px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.papers { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; max-height: 330px; overflow-y: auto; padding: 2px; }
.paper-opt { display: grid; gap: 4px; justify-items: center; background: none; border: 0; padding: 4px; border-radius: 12px; cursor: pointer; font-size: .8rem; font-weight: 700; }
.paper-opt canvas { width: 66px; height: 88px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); }
.paper-opt[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.paper-opt[aria-pressed="true"] canvas { box-shadow: 0 0 0 2.5px var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

/* widgets */
.widget { position: fixed; z-index: 30; border-radius: 20px; box-shadow: 0 20px 50px rgba(5, 10, 20, .35); transform-origin: 0 0; }
.w-rs { position: absolute; right: 2px; bottom: 2px; width: 26px; height: 26px; cursor: nwse-resize; touch-action: none; border-radius: 0 0 16px 0; background: linear-gradient(135deg, transparent 50%, rgba(160,170,190,.75) 50% 56%, transparent 56% 66%, rgba(160,170,190,.75) 66% 72%, transparent 72%); z-index: 3; }
.w-head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 6px 16px; cursor: grab; touch-action: none; }
.w-head b { font-size: .85rem; letter-spacing: .04em; }
.w-sp { flex: 1; }
.w-btn { height: 32px; padding: 0 10px; border-radius: 9px; border: 0; cursor: pointer; font-weight: 700; font-size: .78rem; display: inline-flex; align-items: center; gap: 6px; }
.w-btn svg { width: 15px; height: 15px; }
.w-x { width: 32px; height: 32px; border-radius: 9px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.w-x svg { width: 18px; height: 18px; }

#calc { width: 352px; max-width: calc(100vw - 16px); background: linear-gradient(170deg, #343841, #212329 55%); color: #e8eaee; padding-bottom: 14px; }
#calc .w-btn { background: rgba(255,255,255,.1); color: #e8eaee; }
#calc .w-x { color: #c5c9d2; }
.lcd { margin: 2px 14px 0; border-radius: 10px; background: linear-gradient(#cfd8bd, #bfc9ab); box-shadow: inset 0 2px 7px rgba(0,0,0,.4); padding: 7px 12px 9px; color: #1c2416; font-family: var(--lcd); display: grid; gap: 1px; }
.lcd-ind { display: flex; gap: 10px; font-size: .7rem; letter-spacing: .08em; }
.lcd-ind span { opacity: .14; }
.lcd-ind span.on { opacity: .85; }
.lcd-expr { font-size: 1.02rem; min-height: 1.4em; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
.lcd-res { font-size: 2.15rem; text-align: right; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; padding: 12px 14px 0; }
.k { height: 44px; border-radius: 10px; border: 0; font: 700 .95rem var(--ui); cursor: pointer; box-shadow: 0 2.5px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.18); transition: transform .06s; display: grid; place-content: center; line-height: 1.05; padding: 0; }
.k:active { transform: translateY(2px); box-shadow: 0 .5px 0 rgba(0,0,0,.5); }
.k small { display: block; font-size: .56rem; color: #e8b93a; font-weight: 800; min-height: .7rem; }
.k.num { background: linear-gradient(#f4f5f7, #dfe2e7); color: #1f2228; font-size: 1.12rem; }
.k.fn { background: linear-gradient(#4a505b, #3a3f48); color: #eef0f3; font-size: .8rem; }
.k.op { background: linear-gradient(#6a7484, #555e6c); color: #fff; font-size: 1.2rem; }
.k.eq { background: linear-gradient(#f2762e, #d9530b); color: #fff; font-size: 1.25rem; }
.k.ac { background: linear-gradient(#e0484d, #b92a2f); color: #fff; }
.k.sec { background: linear-gradient(#f0c24b, #d4a72c); color: #2a2208; }
.k.sec.on { box-shadow: 0 0 0 2.5px #fff3c4, 0 2px 0 rgba(0,0,0,.5); }
#calc:focus { outline: none; }
/* engineering calculator skin (v10) */
#calc { width: 384px; background: linear-gradient(175deg, #3a3e47 0%, #262930 38%, #1b1d22 100%); border: 1px solid #0d0e11; box-shadow: 0 24px 60px rgba(5,10,20,.45), inset 0 1px 0 rgba(255,255,255,.12); padding-bottom: 16px; }
#calc .w-head b { letter-spacing: .14em; color: #f2f3f5; white-space: nowrap; }
.cbrand { white-space: nowrap; }
.cbrand { font-size: .56rem; font-weight: 800; letter-spacing: .16em; color: #9aa1ad; margin-left: 8px; }
.cbezel { margin: 2px 12px 0; padding: 8px 10px 10px; border-radius: 14px; background: linear-gradient(#15171b, #1f2227); box-shadow: inset 0 1px 3px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06); }
.csolar { display: flex; gap: 2px; justify-content: flex-end; margin-bottom: 6px; }

#calc .lcd { margin: 0; border-radius: 6px; background: repeating-linear-gradient(0deg, rgba(0,0,0,.025) 0 1px, transparent 1px 3px), linear-gradient(#c9d2be, #b7c1a9); min-height: 96px; }
.lcd-ind { flex-wrap: nowrap; gap: 8px; font-size: .64rem; font-weight: 700; }
.lcd-ind .lcd-mode { margin-left: auto; opacity: .8 !important; }
#cExpr { font-size: 1.08rem; min-height: 1.5em; }
.lcd-res { font-size: 2.05rem; }
.cpanel { font-family: var(--lcd); font-size: .82rem; max-height: 170px; overflow: auto; display: grid; gap: 6px; padding-top: 2px; }
.cpanel .cp-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.cpanel button { font: inherit; font-size: .74rem; border: 1px solid rgba(28,36,22,.35); background: rgba(255,255,255,.18); border-radius: 5px; padding: 4px 7px; cursor: pointer; color: #1c2416; }
.cpanel button[aria-pressed="true"] { background: #1c2416; color: #c9d2be; }
.cpanel input, .cpanel textarea { font: inherit; font-size: .9rem; background: rgba(255,255,255,.28); border: 1px solid rgba(28,36,22,.35); border-radius: 5px; padding: 4px 6px; color: #1c2416; width: 100%; min-width: 0; outline: none; resize: vertical; }
.cpanel input:focus, .cpanel textarea:focus { background: rgba(255,255,255,.45); border-color: #1c2416; }
.cpanel .cp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 4px; }
.cpanel label { display: grid; gap: 2px; font-size: .72rem; }
.cpanel .cp-out { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: .85rem; }
.cpanel .cp-out b { font-weight: 400; opacity: .75; }
.cpanel .cp-out span { text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cpanel table { border-collapse: collapse; width: 100%; font-size: .82rem; }
.cpanel td, .cpanel th { border-bottom: 1px solid rgba(28,36,22,.2); padding: 1px 4px; text-align: right; }
.cpanel .cp-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.cpanel .cp-menu button { text-align: left; padding: 6px 8px; font-size: .82rem; }
.keys.up { grid-template-columns: repeat(6, 1fr); gap: 6px 6px; padding: 12px 14px 0; }
.keys.low { grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 12px 14px 0; }
#calc .k { position: relative; height: 36px; border-radius: 10px 10px 13px 13px; font-family: var(--ui); background: linear-gradient(#3d424c, #2b2f36); color: #f4f5f7; font-size: .78rem; box-shadow: 0 3px 0 #0b0c0f, inset 0 1px 0 rgba(255,255,255,.14); margin-top: 11px; overflow: visible; }
#calc .k:active { transform: translateY(2px); box-shadow: 0 1px 0 #0b0c0f; }
#calc .k small { position: absolute; left: 0; right: 0; top: -13px; display: flex; justify-content: space-between; gap: 2px; padding: 0 2px; font-size: .55rem; min-height: 0; pointer-events: none; white-space: nowrap; }
#calc .k small .s { color: #f0b84a; } #calc .k small .a { color: #ff6b6b; margin-left: auto; }
#calc .keys.low .k { height: 42px; font-size: 1.15rem; }
#calc .k.num { background: linear-gradient(#5a606b, #464b55); color: #fff; }
#calc .k.op { background: linear-gradient(#5a606b, #464b55); color: #fff; font-size: 1.3rem; }
#calc .k.del, #calc .k.ac { background: linear-gradient(#f2a33a, #d9821a); color: #24170a; font-size: .95rem; }
#calc .k.eq { background: linear-gradient(#4f86ff, #2f6fed); color: #fff; }
#calc .k.shift { color: #f0b84a; } #calc .k.alpha { color: #ff6b6b; }
#calc .k.shift.on { box-shadow: 0 0 0 2px #f0b84a, 0 3px 0 #0b0c0f; } #calc .k.alpha.on { box-shadow: 0 0 0 2px #ff6b6b, 0 3px 0 #0b0c0f; }
#calc .k.hyp.on, #calc .k.sto.on { box-shadow: 0 0 0 2px #9fd6ff, 0 3px 0 #0b0c0f; }

#pomo { width: 300px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding-bottom: 16px; }
#pomo .w-btn { background: var(--surface-2); color: var(--ink); }
.pomo-phase { display: flex; justify-content: center; gap: 4px; padding: 0 14px; }
.pomo-phase button { flex: 1; height: 32px; border: 0; border-radius: 9px; background: var(--surface-2); cursor: pointer; font-weight: 700; font-size: .75rem; color: var(--muted); }
.pomo-phase button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.pomo-ring { position: relative; width: 196px; height: 196px; margin: 12px auto 6px; }
.pomo-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.pomo-ring circle { fill: none; stroke-width: 11; }
.pomo-ring .trk { stroke: var(--surface-2); }
.pomo-ring .prg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
.pomo-ring.brk .prg { stroke: var(--ok); }
.pomo-time { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.pomo-time b { font-size: 2.7rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.01em; line-height: 1; }
.pomo-time span { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.pomo-dots { display: flex; justify-content: center; gap: 7px; }
.pomo-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.pomo-dots i.on { background: var(--accent); }
.pomo-ctl { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
.pomo-ctl .btn { min-width: 96px; justify-content: center; }
.pomo-set { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 14px 18px 0; font-size: .85rem; font-weight: 600; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 800; }
.step b { min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.pomo-auto { display: flex; align-items: center; gap: 8px; padding: 10px 18px 0; font-size: .82rem; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 14px; font-weight: 700; font-size: .92rem; max-width: calc(100vw - 32px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 620px) { .status { display: none; } .tab { max-width: 160px; } }
@media (max-width: 560px) { .rtab:not([aria-selected="true"]) span { display: none; } .rtab { padding: 0 9px !important; } #pagesBtn, #layersBtn, #exportBtn, #settingsBtn, #redoBtn { display: none; } .topbar .vsep { display: none; } .tab { max-width: 120px; } }
@media (prefers-reduced-motion: reduce) { .strip, #toast, .tb, .btn, .sw, .otb, .rb, .cover, .k, .pomo-ring .prg { transition: none; } }
/* ---------- friendlier ribbon (v9) ---------- */
.ribbon { box-shadow: 0 4px 14px rgba(15, 20, 35, .06); }
.rtabs { gap: 4px; padding: 6px 10px 2px; height: auto; min-height: 44px; align-items: center; border-bottom: 0; }
.rtab { height: 34px; padding: 0 16px; border-radius: 17px; font-size: .86rem; letter-spacing: .01em; font-weight: 800; transition: background-color .12s, color .12s; }
.rtab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.rtab[aria-selected="true"]::after { display: none; }
.rbody { gap: 8px; padding: 4px 10px 8px; }
.rgroup { border-right: 0; background: var(--surface-2); border-radius: 16px; padding: 4px 8px 3px; }
.rg-items { min-height: 60px; }
.rg-label { text-transform: none; letter-spacing: .01em; font-weight: 700; font-size: .7rem; padding-bottom: 1px; }
.rb { border-radius: 14px; }
.rb[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(20, 28, 45, .12), inset 0 0 0 2px var(--accent); }
.rgroup .otb[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); }
.rgroup .slider { background: none; }
.ribbon.compact .rgroup { padding: 2px 6px; }
.ribbon.vertical .rgroup { border-bottom: 0; margin-bottom: 6px; }
.topbar { border-bottom: 1px solid var(--line); }
.gdiv { position: absolute; z-index: 7; touch-action: none; display: grid; place-items: center; }
.gdiv.v { width: 18px; margin-left: -9px; cursor: col-resize; }
.gdiv.h { height: 18px; margin-top: -9px; cursor: row-resize; }
.gdiv i { background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 2px 6px rgba(10,15,30,.18); border-radius: 4px; }
.gdiv.v i { width: 6px; height: 54px; } .gdiv.h i { width: 54px; height: 6px; }
.gdiv:active i { background: var(--accent); }
/* ---------- home ---------- */
#library { background: radial-gradient(1200px 500px at 10% -10%, var(--accent-soft), transparent 60%), var(--desk); }
.lib-wrap { gap: 26px; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand .logo { width: 56px; height: 56px; flex: none; filter: drop-shadow(0 6px 14px rgba(240,83,47,.32)); }
.brand h1 { font: 700 2.9rem/1 var(--hand); }
.brand p { font-weight: 600; }
.lib-search { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-width: 220px; color: var(--muted); }
.lib-search svg { width: 18px; height: 18px; flex: none; }
.lib-search input { border: 0; outline: none; background: none; font: inherit; color: var(--ink); width: 100%; }
.lib-h2 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
.lib-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.lib-row .lib-h2 { margin: 0; }
.hero { display: flex; align-items: center; gap: 18px; padding: 14px 20px; border-radius: 22px; background: linear-gradient(135deg, color-mix(in srgb, #f0532f 12%, var(--surface)), color-mix(in srgb, #ffd43b 14%, var(--surface))); border: 1px solid var(--line); }
.owl { width: 116px; height: 116px; flex: none; overflow: visible; }
.owl-body { animation: owlBob 3.6s ease-in-out infinite; transform-origin: 70px 126px; }
.owl-eyes { animation: owlBlink 5s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes owlBob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-1.5deg); } }
@keyframes owlBlink { 0%, 93%, 100% { transform: scaleY(1); } 95%, 97% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .owl-body, .owl-eyes { animation: none; } }
.bubble { position: relative; background: var(--surface); border-radius: 18px; padding: 14px 18px; box-shadow: 0 6px 18px rgba(10,15,30,.1); display: grid; gap: 4px; max-width: 560px; }
.bubble::before { content: ""; position: absolute; left: -9px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-left: 0; border-right-color: var(--surface); }
.bubble b { font: 700 1.9rem/1.05 var(--hand); color: var(--ink); }
.bubble span { color: var(--muted); font-weight: 600; }
@media (max-width: 620px) { .owl { width: 86px; height: 86px; } .bubble b { font-size: 1.5rem; } .hero { padding: 10px 12px; gap: 10px; } }
.quick { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
.qcard { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 10px; display: grid; gap: 8px; justify-items: center; cursor: pointer; font-weight: 800; font-size: .85rem; color: var(--ink); transition: transform .1s, box-shadow .15s; }

.shelf { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 28px 22px; }
.nb-new { all: unset; cursor: pointer; aspect-ratio: 3 / 4; border-radius: 8px 16px 16px 8px; border: 2px dashed var(--line); display: grid; place-content: center; justify-items: center; gap: 8px; color: var(--muted); font-weight: 800; background: color-mix(in srgb, var(--surface) 60%, transparent); }

.nb-meta span b { color: var(--ink); font-weight: 700; }
@media (max-width: 620px) { .lib-search { min-width: 0; flex: 1; } .brand h1 { font-size: 2.3rem; } }
/* toolbar placement */

.ribbon.floating { position: fixed; z-index: 22; width: max-content; max-width: min(900px, calc(100vw - 16px)); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 16px 44px rgba(10, 15, 30, .24); overflow: hidden; }

/* focus mode */
body.focus .topbar { display: none !important; }
.mini { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 24; display: flex; align-items: center; gap: 2px; padding: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); max-width: calc(100vw - 16px); overflow-x: auto; }

/* windows */

.win-rs { position: absolute; right: 0; bottom: 0; width: 28px; height: 28px; cursor: nwse-resize; touch-action: none; z-index: 10; background: linear-gradient(135deg, transparent 52%, color-mix(in srgb, var(--muted) 60%, transparent) 52% 58%, transparent 58% 70%, color-mix(in srgb, var(--muted) 60%, transparent) 70% 76%, transparent 76%); }
.fv { position: absolute; inset: 0; overflow: auto; padding: 12px; background: var(--desk); touch-action: none; overscroll-behavior: contain; outline: none; }

.snip-r { position: absolute; border: 2px dashed #fff; outline: 1.5px solid var(--accent); background: rgba(255, 255, 255, .12); box-shadow: 0 0 0 9999px rgba(10, 20, 40, .28); pointer-events: none; }

/* page tabs */

  function pinSetup(after) {

  function trNode(root, D) {

    const pens = [['f', 'Fountain', '#1c2230'], ['a', 'Gel pen', '#2f6fed'], ['l', 'Pencil', '#495057'], ['j', 'Charcoal', '#1c2230'], ['o', 'Crayon', '#e5484d'], ['u', 'Brush', '#7c5cff'], ['m', 'Marker', '#2f9e66'], ['w', 'Watercolor', '#2f6fed'], ['e', 'Neon', '#e64980'], ['v', 'Rainbow', '#e5484d'], ['z', 'Glitter', '#7c5cff'], ['c', 'Calligraphy', '#1c2230']];
    pens.forEach(([k, l, c], i) => { const col = i % 2, row = Math.floor(i / 2), x = 150 + col * 500, y = P.y + row * 92; S(P, wave(x, y + 28, 250, 16, k, c, ['l', 'j', 'o', 'w', 'm'].includes(k) ? 12 : k === 'e' ? 6 : 7)); P.p.items.push({ t: 'text', id: uid(), x: x + 270, y: y + 8, w: 220, txt: l, sz: 27, c: '#1c2230', f: 'sans' }); });

  function explodeObj(o) {

    if (o.t === 'beam') return recordDraw(g => drawBeamItem(g, o, false));
    if (o.t === 'table') return recordDraw(g => drawTable(g, o, false));

  }
  const EXPLODE_OK = o => !!(o.pts ? splitCorners(o) : (o.t === 'beam' || o.t === 'table' || o.t === 's3'));

  // ======================= stickers: emoji and your own =======================
  const EMOJI_STK = ['⭐', '🌟', '✨', '✅', '❌', '❗', '❓', '⚠️', '💡', '📌', '📎', '📚', '📖', '✏️', '📝', '📐', '📏', '🧮', '🔬', '🧪', '🧠', '💯', '🎯', '🏆', '🥇', '🔥', '⚡', '🚀', '⏰', '📅', '💪', '👍', '👏', '🙌', '😎', '🤓', '😅', '😴', '🥳', '🤯', '❤️', '💙', '💚', '💛', '🦉', '🐶', '🐱', '🍀', '☕', '🍕', '🎉', '🎵', '➡️', '⬅️', '⬆️', '⬇️', '🔁', '🏗️', '⚙️', '🔩'];
  let myStk = [];
  const saveMyStk = () => Store.write('mystk', { list: myStk }).catch(() => toast("Couldn't save your stickers.", 2000));
  function uploadSticker() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try {
        const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); });
        const k = Math.min(1, 600 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src);
        const src = await canvasToSrc(c, false, true); if (!src) return;
        const ent = { id: uid(), src, ar: c.width / c.height }; myStk.unshift(ent); saveMyStk(); T.sticker = 'my:' + ent.id; T.stkTab = 'mine'; saveTools(); buildRibbon(); setStatus('saved');
        modal(`<div class="ex-head">${svg('sticker')}<div><h2>Sticker added</h2><p>Want to cut it out from its background so it looks like a real sticker?</p></div></div><div class="stk-prev"><img alt="" src="${src}"></div>
          <div class="modal-actions"><button class="btn" data-x>Keep as is</button><button class="btn primary" data-rb>${svg('magic')}Remove background</button></div>`, (m, close) => {
          m.querySelector('[data-x]').onclick = close;
          m.querySelector('[data-rb]').onclick = () => { close(); bgRemoveModal({ src }, ch => { ent.src = ch.src; saveMyStk(); buildRibbon(); toast('Sticker ready. Tap the page to place it.', 2200); }); };
        });
      } catch (e) { toast("That picture couldn't be used. Try a PNG or JPG.", 2400); }
    };
    inp.click();
  }

  // ======================= boot =======================
  panes.push(createPane($('#paneA')), createPane($('#paneB')), createPane($('#paneC')), createPane($('#paneD')));
  activePane = panes[0];
  document.body.classList.add('in-lib');
  applyRibbonPos(true);
  applyTheme();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bumpAll(); reqAll(); thumbsAll(); });
  if (pomo.running && pomoLeft() <= 0) { pomo.running = false; pomo.left = pomoDur(pomo.phase); pomoSave(); }
  pomoRender();
  async function boot() {
    $('#libStatus').textContent = '· loading…';
    await Store.init();
    Store.read('avatar').then(d => { if (d && d.d) { avatarImg = d.d; refreshAvatars(); } }).catch(() => {});
    Store.read('mystk').then(d => { if (d && Array.isArray(d.list)) { myStk = d.list.filter(m => m && m.src); if (!$('#editor').hidden) buildRibbon(); } }).catch(() => {});
    if (home().bg === 'photo') Store.read('homebg').then(d => { if (d && d.d) { homeBgImg = d.d; applyHome(); } }).catch(() => {});
    if (Sync.on()) { $('#libStatus').textContent = '· syncing…'; await Promise.race([Sync.init().then(() => Sync.user ? Sync.sync() : 0), new Promise(r => setTimeout(r, 6000))]).catch(() => {}); }
    let idx = await Store.read('index');
    Sync.booted = true;
    if (!idx && Store.mode === 'cloud') {
      const local = ls.get('inkleaf:index', null);
      if (local && local.notebooks && local.notebooks.length) {
        idx = local;
        for (const n of local.notebooks) for (const pid of n.pages) { const d = ls.get('inkleaf:p-' + pid, null); if (d) await Store.write('p-' + pid, d).catch(() => {}); }
        for (const n of local.notebooks) { const d = ls.get('inkleaf:cvimg-' + n.id, null); if (d) await Store.write('cvimg-' + n.id, d).catch(() => {}); }
        { const av = ls.get('inkleaf:avatar', null); if (av) await Store.write('avatar', av).catch(() => {}); const hb = ls.get('inkleaf:homebg', null); if (hb) await Store.write('homebg', hb).catch(() => {}); }
        for (const e of (local.trash || [])) for (const pid of (e.k === 'nb' ? e.n.pages : [e.id])) { const d = ls.get('inkleaf:p-' + pid, null); if (d) await Store.write('p-' + pid, d).catch(() => {}); }
        await Store.write('index', idx).catch(() => {});
      }
    }
    if (idx && Array.isArray(idx.notebooks)) { index = idx; index.notebooks.forEach(n => { if (!n.size) n.size = 'tablet'; }); }
    trashList().filter(e => Date.now() - e.del > TRASH_DAYS * 864e5).forEach(purgeTrash);
    if (!idx) buildGuide();
    tabState.tabs = tabState.tabs.filter(id => index.notebooks.some(n => n.id === id));
    renderLibrary();
    if (!settings.onboarded) runOnboarding(false);
    else if (settings.bkRemind && index.notebooks.length && Date.now() - (settings.lastBackup || settings.bkSince || (settings.bkSince = Date.now(), saveSettings(), Date.now())) > settings.bkRemind * 864e5) setTimeout(() => toast(`Time for a backup: Settings → Storage and backup → Back up all notebooks.`, 5000), 1500);
  }
  applyLang();
  if (lockCfg()) showLock();
  boot();
})();
